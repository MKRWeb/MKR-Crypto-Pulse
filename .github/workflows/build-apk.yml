name: Build & Release MKR Crypto Pulse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fix package.json, capacitor.config.json & www/ Folder
        run: |
          mkdir -p www

          # If files were uploaded to the root folder, copy them into www/
          for f in index.html style.css app.js sw.js manifest.json; do
            if [ -f "$f" ]; then
              cp "$f" "www/$f"
            fi
          done

          # Write a 100% valid, conflict-free package.json using Node
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "mkr-crypto-pulse",
              version: "1.0.0",
              description: "MKR Crypto Pulse Android APK",
              main: "www/index.html",
              dependencies: {
                "@capacitor/android": "6.2.0",
                "@capacitor/core": "6.2.0"
              },
              devDependencies: {
                "@capacitor/cli": "6.2.0"
              }
            }, null, 2));

            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.mkrweb.mkrcryptopulse",
              appName: "MKR Crypto Pulse",
              webDir: "www",
              bundledWebRuntime: false,
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true
              }
            }, null, 2));
          '

      - name: Install Capacitor & Build Android Project
        run: |
          rm -rf node_modules package-lock.json android
          npm install --legacy-peer-deps --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Enable Android Cleartext Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MKR-Crypto-Pulse.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MKR-Crypto-Pulse-APK
          path: MKR-Crypto-Pulse.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MKR Crypto Pulse v1.0.${{ github.run_number }}"
          body: "Official Android APK release of **MKR Crypto Pulse**."
          files: MKR-Crypto-Pulse.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
